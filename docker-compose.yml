services:
  insurance-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: insurance-mlops-api:latest
    container_name: insurance_mlops_inference_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
